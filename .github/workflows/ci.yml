name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check app loads
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          PGSSL: false
        run: node -e "require('./src/app'); console.log('App loaded')"
